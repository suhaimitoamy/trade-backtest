<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b10">
  <title>Trade Backtest</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090b10;
      --panel: #11151d;
      --panel-2: #171c26;
      --line: #252c39;
      --text: #f4f7fb;
      --muted: #8e99aa;
      --accent: #f1b94a;
      --positive: #42d392;
      --negative: #ff6b6b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top right, rgba(241, 185, 74, .12), transparent 32rem),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 56px;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 46px); }
    p { margin: 0; color: var(--muted); line-height: 1.6; }

    button {
      min-height: 46px;
      border: 0;
      border-radius: 12px;
      padding: 0 20px;
      background: var(--accent);
      color: #17120a;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    button:disabled { opacity: .55; cursor: wait; }

    .status {
      margin-bottom: 18px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(17, 21, 29, .85);
      color: var(--muted);
    }

    .status.error { border-color: rgba(255, 107, 107, .45); color: var(--negative); }
    .status.success { border-color: rgba(66, 211, 146, .35); color: var(--positive); }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }

    .card, .chart-card {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: linear-gradient(145deg, rgba(23, 28, 38, .96), rgba(13, 16, 23, .96));
      box-shadow: 0 18px 50px rgba(0, 0, 0, .22);
    }

    .card { padding: 18px; }
    .label { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
    .value { font-size: clamp(22px, 4vw, 32px); font-weight: 800; }
    .chart-card { padding: 18px; overflow: hidden; }
    .chart-card h2 { margin: 0 0 16px; font-size: 18px; }
    #chart { display: none; width: 100%; height: auto; border-radius: 10px; background: white; }
    .empty { padding: 50px 16px; text-align: center; color: var(--muted); }

    @media (max-width: 760px) {
      header { flex-direction: column; }
      button { width: 100%; }
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 460px) {
      main { width: min(100% - 22px, 1100px); padding-top: 22px; }
      .metrics { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Trade Backtest</h1>
        <p>Dashboard untuk menjalankan engine Python melalui FastAPI di Vercel.</p>
      </div>
      <button id="runButton" type="button">Jalankan Backtest</button>
    </header>

    <div id="status" class="status">Siap menjalankan backtest.</div>

    <section class="metrics" aria-label="Metrik backtest">
      <article class="card"><div class="label">Total Trade</div><div id="totalTrades" class="value">—</div></article>
      <article class="card"><div class="label">Win Rate</div><div id="winrate" class="value">—</div></article>
      <article class="card"><div class="label">Total PnL</div><div id="totalPnl" class="value">—</div></article>
      <article class="card"><div class="label">Expectancy</div><div id="expectancy" class="value">—</div></article>
      <article class="card"><div class="label">Rata-rata R</div><div id="avgR" class="value">—</div></article>
      <article class="card"><div class="label">Max Drawdown</div><div id="maxDrawdown" class="value">—</div></article>
    </section>

    <section class="chart-card">
      <h2>Equity Curve</h2>
      <div id="emptyChart" class="empty">Grafik akan muncul setelah backtest selesai.</div>
      <img id="chart" alt="Grafik equity curve hasil backtest">
    </section>
  </main>

  <script>
    const runButton = document.getElementById('runButton');
    const statusBox = document.getElementById('status');
    const chart = document.getElementById('chart');
    const emptyChart = document.getElementById('emptyChart');

    const fields = {
      totalTrades: document.getElementById('totalTrades'),
      winrate: document.getElementById('winrate'),
      totalPnl: document.getElementById('totalPnl'),
      expectancy: document.getElementById('expectancy'),
      avgR: document.getElementById('avgR'),
      maxDrawdown: document.getElementById('maxDrawdown')
    };

    function setStatus(message, type = '') {
      statusBox.textContent = message;
      statusBox.className = `status ${type}`.trim();
    }

    function money(value) {
      return new Intl.NumberFormat('en-US', {
        style: 'currency', currency: 'USD', maximumFractionDigits: 2
      }).format(Number(value || 0));
    }

    async function runBacktest() {
      runButton.disabled = true;
      setStatus('Backtest sedang dijalankan…');

      try {
        const response = await fetch('/api/backtest', {
          method: 'GET',
          headers: { Accept: 'application/json' },
          cache: 'no-store'
        });

        const payload = await response.json();
        if (!response.ok || payload.error) {
          throw new Error(payload.error || `HTTP ${response.status}`);
        }

        const metrics = payload.metrics || {};
        fields.totalTrades.textContent = metrics.total_trades ?? 0;
        fields.winrate.textContent = `${metrics.winrate ?? 0}%`;
        fields.totalPnl.textContent = money(metrics.total_pnl);
        fields.expectancy.textContent = money(metrics.expectancy);
        fields.avgR.textContent = `${metrics.avg_r_multiple ?? 0}R`;
        fields.maxDrawdown.textContent = `${metrics.max_drawdown ?? 0}%`;

        if (payload.chart_base64) {
          chart.src = `data:image/png;base64,${payload.chart_base64}`;
          chart.style.display = 'block';
          emptyChart.style.display = 'none';
        }

        setStatus('Backtest selesai.', 'success');
      } catch (error) {
        setStatus(`Gagal menjalankan backtest: ${error.message}`, 'error');
      } finally {
        runButton.disabled = false;
      }
    }

    runButton.addEventListener('click', runBacktest);
  </script>
</body>
</html>
