name: XAUUSD 2026 Dukascopy Repair

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/xauusd-2026-dukascopy-repair.yml'
      - 'tools/xauusd_2026_repair.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download, decode, audit, and package
        env:
          OUTPUT_DIR: ${{ runner.temp }}/xauusd-2026-repair
        run: |
          sed -i 's/candles\[0\]\.isoformat()/candles[0].ts.isoformat()/g; s/candles\[-1\]\.isoformat()/candles[-1].ts.isoformat()/g' tools/xauusd_2026_repair.py
          python tools/xauusd_2026_repair.py
      - name: Upload audited data package
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-2026-jan-jul-dukascopy-audited
          path: ${{ runner.temp }}/xauusd-2026-repair/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
