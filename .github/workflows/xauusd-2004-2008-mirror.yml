name: XAUUSD 2004-2008 Mirror Builder

on:
  push:
    branches:
      - data/xauusd-2004-2008-builder
    paths:
      - .github/workflows/xauusd-2004-2008-mirror.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Download verified XAUUSD M1 mirror
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p raw output
          python -m pip install --quiet --upgrade huggingface_hub hf_xet
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          p = hf_hub_download(
              repo_id='ZombitX64/xauusd-gold-price-historical-data-2004-2025',
              repo_type='dataset',
              filename='XAU_1m_data.jsonl',
              local_dir='raw',
          )
          print(p)
          PY
          echo '89cf3503acd93d864f38666ca37bff0f52e56561ec25cf317182fa0077b1eb30  raw/XAU_1m_data.jsonl' | sha256sum -c -
          du -h raw/XAU_1m_data.jsonl
          head -n 2 raw/XAU_1m_data.jsonl

      - name: Split 2004-2008 M1 rows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json
          from datetime import datetime
          from pathlib import Path

          years = range(2004, 2009)
          raw = Path('raw')
          handles = {}
          writers = {}
          counts = {y: 0 for y in years}
          first = {y: None for y in years}
          last = {y: None for y in years}

          def parse_dt(value):
              s = str(value).strip()
              for fmt in (
                  '%Y.%m.%d %H:%M:%S', '%Y.%m.%d %H:%M',
                  '%Y-%m-%d %H:%M:%S', '%Y-%m-%d %H:%M',
                  '%Y-%m-%dT%H:%M:%SZ', '%Y-%m-%dT%H:%M:%S',
              ):
                  try:
                      return datetime.strptime(s, fmt)
                  except ValueError:
                      pass
              raise ValueError(f'Unsupported Date value: {s!r}')

          for y in years:
              f = (raw / f'XAUUSD_{y}_M1_MIRROR.csv').open('w', newline='', encoding='utf-8')
              handles[y] = f
              w = csv.writer(f)
              w.writerow(['timestamp','open','high','low','close','volume'])
              writers[y] = w

          total_lines = 0
          selected = 0
          with (raw / 'XAU_1m_data.jsonl').open('r', encoding='utf-8') as src:
              for line_no, line in enumerate(src, 1):
                  if not line.strip():
                      continue
                  total_lines += 1
                  obj = json.loads(line)
                  lower = {str(k).strip().lower(): v for k, v in obj.items()}
                  date_val = lower.get('date', lower.get('datetime', lower.get('timestamp')))
                  if date_val is None:
                      raise SystemExit(f'No date/timestamp key on line {line_no}: {list(obj)}')
                  dt = parse_dt(date_val)
                  y = dt.year
                  if y < 2004:
                      continue
                  if y > 2008:
                      # The dedicated M1 file is chronological; all requested years are complete.
                      break
                  for key in ('open','high','low','close'):
                      if key not in lower:
                          raise SystemExit(f'Missing {key} on line {line_no}')
                  vol = lower.get('volume', '')
                  writers[y].writerow([
                      dt.strftime('%Y-%m-%d %H:%M:%S'),
                      lower['open'], lower['high'], lower['low'], lower['close'], vol,
                  ])
                  counts[y] += 1
                  selected += 1
                  if first[y] is None:
                      first[y] = dt
                  last[y] = dt

          for f in handles.values():
              f.close()

          print(f'total_jsonl_lines_scanned={total_lines} selected_2004_2008={selected}')
          for y in years:
              print(f'{y}: rows={counts[y]} first={first[y]} last={last[y]}')
              if counts[y] == 0:
                  raise SystemExit(f'No M1 rows found for {y}')
          PY

      - name: Audit cadence and OHLC, aggregate to M5-M15-H1-H4-D1
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pandas
          for YEAR in 2004 2005 2006 2007 2008; do
            echo "=== BUILD ${YEAR} ==="
            YEAR="$YEAR" \
            SOURCE_CSV="raw/XAUUSD_${YEAR}_M1_MIRROR.csv" \
            SOURCE_PROVIDER="Hugging Face mirror: ZombitX64/xauusd-gold-price-historical-data-2004-2025" \
            SOURCE_ENGINE="XAU_1m_data.jsonl (SHA256 89cf3503acd93d864f38666ca37bff0f52e56561ec25cf317182fa0077b1eb30); upstream dataset card cites Kaggle novandraanugrah/xauusd-gold-price-historical-data-2004-2024" \
            QUOTE_SIDE="source-defined / not independently verified as BID or ASK" \
            TIMESTAMP_NOTE="source wall time preserved exactly; timezone not independently verified; no timezone shift applied" \
            ASSUME_UTC=0 \
            python tools/xauusd_historical_builder.py
          done

      - name: Write source provenance
        shell: bash
        run: |
          cat > output/XAUUSD_2004_2008_SOURCE_PROVENANCE.txt <<'EOF'
          XAUUSD 2004-2008 SOURCE PROVENANCE

          Primary build source:
          - Hugging Face dataset: ZombitX64/xauusd-gold-price-historical-data-2004-2025
          - File: XAU_1m_data.jsonl
          - Published file size: 649 MB
          - Verified SHA256: 89cf3503acd93d864f38666ca37bff0f52e56561ec25cf317182fa0077b1eb30
          - Dataset card states upstream source: Kaggle novandraanugrah/xauusd-gold-price-historical-data-2004-2024

          Direct-source verification attempt:
          - Dukascopy Jetta M1 XAUUSD retrieval was independently probed successfully for 2004-05-05.
          - A full-year direct export was not used as the primary build because Dukascopy returned HTTP 429 rate-limit errors during long exports.
          - Therefore these 2004-2008 packages MUST NOT be described as row-for-row verified Dukascopy BID data.

          Integrity rules applied:
          - No interpolation.
          - No forward fill.
          - No synthetic M1 candles.
          - Exact duplicate OHLC/timestamp rows may be removed.
          - Conflicting duplicate timestamps, malformed rows, or invalid OHLC cause the build to fail.
          - M5/M15/H1/H4/D1 are aggregated only from observed M1 rows.
          - Source wall-clock timestamps are preserved; timezone is not independently verified.
          EOF

      - name: Create combined package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, zipfile
          out = Path('output')
          files = []
          for year in range(2004, 2009):
              files.extend([
                  out / f'XAUUSD_{year}_MONTHLY_ARCHIVES_REPAIRED_AUDITED.zip',
                  out / f'XAUUSD_{year}_AGGREGATION_REPORT.txt',
                  out / f'XAUUSD_{year}_AGGREGATION_AUDIT.csv',
                  out / f'XAUUSD_{year}_AGGREGATION_MANIFEST.json',
              ])
          files.append(out / 'XAUUSD_2004_2008_SOURCE_PROVENANCE.txt')
          for p in files:
              if not p.exists() or p.stat().st_size == 0:
                  raise SystemExit(f'Missing output: {p}')
          package = out / 'XAUUSD_REPAIRED_AUDITED_2004-2008.zip'
          with zipfile.ZipFile(package, 'w', zipfile.ZIP_DEFLATED, compresslevel=6) as z:
              for p in files:
                  z.write(p, p.name)
          h=hashlib.sha256(package.read_bytes()).hexdigest()
          print(f'{package} bytes={package.stat().st_size} sha256={h}')
          PY

      - name: Upload audited package artifact
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-2004-2008-REPAIRED-AUDITED
          path: |
            output/XAUUSD_REPAIRED_AUDITED_2004-2008.zip
            output/XAUUSD_2004_2008_SOURCE_PROVENANCE.txt
            output/XAUUSD_2004_AGGREGATION_REPORT.txt
            output/XAUUSD_2005_AGGREGATION_REPORT.txt
            output/XAUUSD_2006_AGGREGATION_REPORT.txt
            output/XAUUSD_2007_AGGREGATION_REPORT.txt
            output/XAUUSD_2008_AGGREGATION_REPORT.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
