name: Build and Publish Trade Backtest APK

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: [ "master" ]
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write
  statuses: write

concurrency:
  group: trade-backtest-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BACKTEST_WEB_URL: ${{ vars.BACKTEST_WEB_URL || 'https://trade-backtest.vercel.app' }}
      APK_PATH: android-app/app/build/outputs/apk/debug/app-debug.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Cache Android debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: trade-backtest-debug-keystore-v1

      - name: Create Android debug keystore if missing
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair \
              -v \
              -storetype JKS \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: |
          gradle --no-daemon --stacktrace -p android-app :app:assembleDebug \
            -PBACKTEST_WEB_URL="$BACKTEST_WEB_URL"

      - name: Verify APK
        run: |
          set -euo pipefail
          test -s "$APK_PATH"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK_PATH"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK_PATH"
          mkdir -p dist
          cp "$APK_PATH" dist/TradeBacktest-latest.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TradeBacktest-debug-apk
          path: dist/TradeBacktest-latest.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling APK release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f tradebacktest-latest "$GITHUB_SHA"
          git push origin refs/tags/tradebacktest-latest --force

          if gh release view tradebacktest-latest >/dev/null 2>&1; then
            gh release edit tradebacktest-latest \
              --title "Trade Backtest Latest" \
              --notes "APK terbaru aplikasi Trade Backtest." \
              --latest
          else
            gh release create tradebacktest-latest \
              --title "Trade Backtest Latest" \
              --notes "APK terbaru aplikasi Trade Backtest." \
              --latest
          fi

          gh release upload tradebacktest-latest dist/TradeBacktest-latest.apk --clobber
          gh release view tradebacktest-latest --json assets --jq '.assets[].name' | grep -Fx 'TradeBacktest-latest.apk'
