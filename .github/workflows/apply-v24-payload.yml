name: Apply Trading Method Lab v2.4 Payload

on:
  push:
    branches: ["feature/acceptance-sweep-app-20260806"]
    paths:
      - "tools/v24_payload.ready"

permissions:
  contents: write

concurrency:
  group: apply-v24-payload
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/acceptance-sweep-app-20260806
          fetch-depth: 0
      - name: Decode audited v2.4 source payload
        run: python tools/apply_v24_payload.py
      - name: Keep build workflow for a separate trusted update
        run: git checkout HEAD -- .github/workflows/android-apk.yml
      - name: Commit generated application sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply audited ICT builder and in-app updates v2.4"
          git push origin HEAD:feature/acceptance-sweep-app-20260806
