name: Backtest CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-backtest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Generate Dummy Data (if missing)
      run: |
        if [ ! -f data/dummy_data.csv ]; then
          python generate_dummy_data.py
        fi
        
    - name: Run Engine CLI Test
      run: python main.py
