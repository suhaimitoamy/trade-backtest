name: Runner Smoke Test

on:
  push:
    branches: ["ci/rebuild-apk-20260724"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-ubuntu-22:
    runs-on: ubuntu-22.04
    steps:
      - name: Verify Ubuntu 22.04 runner
        run: |
          echo "runner-22-ok"
          uname -a

  smoke-ubuntu-24:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify Ubuntu 24.04 runner
        run: |
          echo "runner-24-ok"
          uname -a
